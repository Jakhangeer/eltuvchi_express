<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kirish — ZooMo</title><link rel="icon" type="image/png" href="/static/images/favicon.png"><link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Light/Dark rejim boshqaruvchisi — sinxron, boshqa skriptlardan oldin -->
    <script src="/static/js/ui-mode.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           TOKENLAR — standart: LIGHT. Dark rejim html[data-mode="dark"] orqali.
           ========================================================= */
        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --card-border: #E2E8F0;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, .05), 0 24px 60px -30px rgba(15, 23, 42, .18);
            --text: #0F172A;
            --muted: #64748B;
            --field-bg: #FFFFFF;
            --field-border: #E2E8F0;
            --primary: #2563EB;
            --primary-2: #1D4ED8;
            --primary-rgb: 37, 99, 235;
            --accent: #10B981;
            --ring: rgba(37, 99, 235, .16);
            --glow: rgba(37, 99, 235, .35);
            --danger-bg: #FEF2F2;
            --danger-border: #FECACA;
            --danger-text: #B91C1C;
            --blob-a: #BFDBFE;
            --blob-b: #A7F3D0;
            --blob-c: #DDD6FE;
            --blob-opacity: .55;
        }
        html[data-mode="dark"] {
            --bg: #05060A;
            --card: rgba(255, 255, 255, .05);
            --card-border: rgba(255, 255, 255, .10);
            --card-shadow: 0 25px 60px -15px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
            --text: #F1F5F9;
            --muted: #94A3B8;
            --field-bg: rgba(255, 255, 255, .04);
            --field-border: rgba(255, 255, 255, .10);
            --primary: #6366F1;
            --primary-2: #4F46E5;
            --primary-rgb: 99, 102, 241;
            --accent: #34D399;
            --ring: rgba(99, 102, 241, .22);
            --glow: rgba(99, 102, 241, .5);
            --danger-bg: rgba(239, 68, 68, .10);
            --danger-border: rgba(239, 68, 68, .30);
            --danger-text: #FCA5A5;
            --blob-a: #6366F1;
            --blob-b: #34D399;
            --blob-c: #FBBF24;
            --blob-opacity: .32;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color .4s ease, color .3s ease;
        }
        [hidden] { display: none !important; }

        /* ---- 4) ORQA FON: juda sekin, ko'zga tashlanmaydigan gradient/blur doiralar ---- */
        .ambient { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob-opacity); will-change: transform; transition: opacity .6s ease; }
        .blob.b1 { width: 460px; height: 460px; background: var(--blob-a); top: -140px; left: -120px; animation: drift1 38s ease-in-out infinite; }
        .blob.b2 { width: 420px; height: 420px; background: var(--blob-b); bottom: -150px; right: -110px; animation: drift2 44s ease-in-out infinite; }
        .blob.b3 { width: 320px; height: 320px; background: var(--blob-c); top: 42%; left: 52%; opacity: calc(var(--blob-opacity) * .6); animation: drift3 52s ease-in-out infinite; }
        @keyframes drift1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(70px, 90px) scale(1.12); } }
        @keyframes drift2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-80px, -60px) scale(1.1); } }
        @keyframes drift3 { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-42%, -58%) scale(1.25); } }

        /* zarrachalar — faqat tungi rejimda */
        #particle-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; display: none; }
        html[data-mode="dark"] #particle-layer { display: block; }
        .particle { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .5); animation: rise linear infinite; }
        @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .7; } 90% { opacity: .5; } 100% { transform: translateY(-100vh) translateX(20px); opacity: 0; } }

        /* ---- KARTA ---- */
        .stage { position: relative; z-index: 2; width: 100%; max-width: 400px; }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 34px 30px 30px;
            backdrop-filter: blur(22px) saturate(150%);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
            transition: background-color .4s ease, border-color .4s ease, box-shadow .4s ease;
        }

        /* ---- 1) FADE-IN & SLIDE-UP (kartochka va forma elementlari ketma-ket) ---- */
        .reveal { animation: revealUp .75s cubic-bezier(.22, 1, .36, 1) backwards; animation-delay: calc(var(--d, 0) * 80ms); }
        @keyframes revealUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- Brend ---- */
        .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; text-align: center; }
        /* ZooMo logotipi har doim OQ "plitka" ustida — to'q yashil matn tungi rejimda ham yaxshi ko'rinsin */
        .logo {
            padding: 14px 22px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
            background: #FFFFFF; border: 1px solid var(--card-border); margin-bottom: 14px; overflow: hidden;
            font-size: 28px; font-weight: 800; color: #0B6B35;
            animation: logoPulse 3.2s ease-out infinite;
        }
        .logo img { width: 210px; max-width: 100%; height: auto; object-fit: contain; display: block; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        @keyframes logoPulse { 0% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb), .30); } 70% { box-shadow: 0 0 0 16px rgba(var(--primary-rgb), 0); } 100% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb), 0); } }
        .brand h1 {
            margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .brand p { margin: 6px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

        /* ---- Xato xabari ---- */
        .alert {
            background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text);
            border-radius: 14px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px;
            animation: revealUp .75s cubic-bezier(.22, 1, .36, 1) backwards, shake .5s .5s ease;
        }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

        /* ---- 2) INTERAKTIV INPUT: fokusda accent glow ---- */
        form { display: flex; flex-direction: column; gap: 18px; }
        .field { display: block; }
        .field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 7px 2px; transition: color .25s ease; }
        .field:focus-within .field-label { color: var(--primary); }
        .field-box {
            display: flex; align-items: center; gap: 10px; padding: 0 14px;
            background: var(--field-bg); border: 1px solid var(--field-border); border-radius: 14px;
            transition: border-color .25s ease, box-shadow .3s ease, transform .25s ease, background-color .3s ease;
        }
        .field-box:hover { border-color: rgba(var(--primary-rgb), .35); }
        .field-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring), 0 10px 28px -12px var(--glow);
            transform: translateY(-1px);
        }
        .field-ico { font-size: 16px; opacity: .55; transition: opacity .25s ease, transform .25s ease; flex-shrink: 0; }
        .field-box:focus-within .field-ico { opacity: 1; transform: scale(1.12); }
        .field-box input {
            flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text);
            font: inherit; font-size: 16px; padding: 14px 0;
        }
        .field-box input::placeholder { color: #94A3B8; opacity: .8; }
        .eye { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; padding: 6px; border-radius: 8px; line-height: 1; }
        .eye:hover { color: var(--primary); }
        .hint { margin: 7px 2px 0; font-size: 11px; color: var(--muted); line-height: 1.45; }

        /* ---- 3) TUGMA: ripple + loading pulse ---- */
        .btn {
            position: relative; overflow: hidden; width: 100%; border: 0; cursor: pointer; color: #fff;
            font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .02em; padding: 15px 18px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 10px 26px -10px var(--glow);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform .18s ease, box-shadow .3s ease, filter .3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn::after { /* hover'da yorug' "sheen" */
            content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .35), transparent);
            transform: skewX(-20deg); transition: left .7s ease; pointer-events: none;
        }
        .btn:hover { box-shadow: 0 16px 34px -10px var(--glow); filter: brightness(1.05); }
        .btn:hover::after { left: 120%; }
        .btn:active { transform: scale(.975); }
        .btn-label, .btn-arrow { position: relative; z-index: 2; }
        .btn-arrow { transition: transform .25s ease; }
        .btn:hover .btn-arrow { transform: translateX(4px); }
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255, 255, 255, .55);
            animation: ripple .65s ease-out forwards; pointer-events: none; z-index: 1;
        }
        @keyframes ripple { to { transform: scale(1); opacity: 0; } }
        .btn-spin {
            position: relative; z-index: 2; width: 16px; height: 16px; border-radius: 50%; display: none;
            border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn.is-loading { pointer-events: none; animation: btnPulse 1.3s ease-out infinite; }
        .btn.is-loading .btn-spin { display: inline-block; }
        .btn.is-loading .btn-arrow { display: none; }
        @keyframes btnPulse { 0% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb), .45); } 100% { box-shadow: 0 0 0 18px rgba(var(--primary-rgb), 0); } }

        /* ---- Telegram avtomatik kirish holati ---- */
        #auto-login-status { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
        #auto-login-status p { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; }
        .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(var(--primary-rgb), .18); border-top-color: var(--primary); animation: spin .9s linear infinite; }

        @media (max-width: 420px) { .card { padding: 28px 22px 24px; border-radius: 22px; } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
            .blob { animation: none !important; }
        }
    </style>
</head>
<body>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
    </script>

    <div class="ambient" aria-hidden="true">
        <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    </div>
    <div id="particle-layer" aria-hidden="true"></div>

    <main class="stage">
        <!-- AVTOMATIK KIRISH HOLATI (Telegram Mini App) -->
        <div id="auto-login-status" hidden>
            <div class="spinner"></div>
            <p>Telegram orqali avtomatik kirilmoqda...</p>
        </div>

        <!-- LOGIN KARTASI -->
        <section id="login-form-wrapper" class="card reveal" style="--d:0">
            <div class="brand reveal" style="--d:2">
                <div class="logo">
                    <img src="/static/images/logo.png" alt="ZooMo Delivery Service" onerror="this.style.display='none'; this.parentElement.textContent='ZooMo';">
                </div>
                <h1 class="sr-only">ZooMo</h1>
                <p>Boshqaruv Paneliga Kirish</p>
            </div>

            {% if error %}
            <div class="alert" role="alert">{{ error }}</div>
            {% endif %}

            <form action="/login" method="POST" id="login-form" autocomplete="on">
                <input type="hidden" name="next" value="{{ next_url }}">

                <label class="field reveal" style="--d:4">
                    <span class="field-label">Telefon raqami</span>
                    <span class="field-box">
                        <span class="field-ico" aria-hidden="true">📱</span>
                        <input type="text" name="phone_number" placeholder="+998901234567" inputmode="tel" autocomplete="username" required autofocus>
                    </span>
                </label>

                <div class="field reveal" style="--d:5">
                    <label class="field-label" for="password-input">Parol / PIN</label>
                    <span class="field-box">
                        <span class="field-ico" aria-hidden="true">🔒</span>
                        <input type="password" id="password-input" name="password" inputmode="numeric" autocomplete="current-password" required>
                        <button type="button" class="eye" id="eye-btn" aria-label="Parolni ko'rsatish">👁</button>
                    </span>
                    <p class="hint">Kuryer/hamkor uchun — 4 xonali PIN. Admin/operator uchun — oddiy parol.</p>
                </div>

                <button type="submit" id="login-submit-btn" class="btn reveal" style="--d:7">
                    <span class="btn-label">Kirish</span>
                    <span class="btn-arrow" aria-hidden="true">→</span>
                    <span class="btn-spin" aria-hidden="true"></span>
                </button>
            </form>
        </section>
    </main>

    <script>
        // ---- Nozik suzuvchi zarrachalar (faqat tungi rejimda ko'rinadi) ----
        (function spawnParticles() {
            var layer = document.getElementById('particle-layer');
            var count = window.innerWidth < 640 ? 12 : 22;
            for (var i = 0; i < count; i++) {
                var p = document.createElement('div');
                var size = 1 + Math.random() * 2.5;
                p.className = 'particle';
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.bottom = '-10px';
                p.style.animationDuration = (10 + Math.random() * 14) + 's';
                p.style.animationDelay = (Math.random() * 12) + 's';
                layer.appendChild(p);
            }
        })();

        // ---- Parolni ko'rsatish/yashirish ----
        (function () {
            var eye = document.getElementById('eye-btn');
            var input = document.getElementById('password-input');
            if (!eye || !input) return;
            eye.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                eye.textContent = show ? '🙈' : '👁';
                eye.setAttribute('aria-label', show ? "Parolni yashirish" : "Parolni ko'rsatish");
            });
        })();

        // ---- Yengil bosilish ovozi (ixtiyoriy — xato bo'lsa jim o'tadi) ----
        var clickAudioCtx = null;
        function playClickSound() {
            try {
                clickAudioCtx = clickAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (clickAudioCtx.state === 'suspended') clickAudioCtx.resume();
                var t = clickAudioCtx.currentTime;
                var osc = clickAudioCtx.createOscillator();
                var gain = clickAudioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(720, t);
                osc.frequency.exponentialRampToValueAtTime(920, t + 0.09);
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.18, t + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.connect(gain); gain.connect(clickAudioCtx.destination);
                osc.start(t); osc.stop(t + 0.22);
            } catch (e) {}
        }

        // ---- TUGMA: ripple + loading ----
        (function () {
            var form = document.getElementById('login-form');
            var btn = document.getElementById('login-submit-btn');
            if (!form || !btn) return;
            var label = btn.querySelector('.btn-label');
            var originalText = label.textContent;
            var submitting = false;

            btn.addEventListener('pointerdown', function (e) {
                var rect = btn.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height) * 2;
                var r = document.createElement('span');
                r.className = 'ripple';
                r.style.width = r.style.height = size + 'px';
                r.style.left = (e.clientX - rect.left - size / 2) + 'px';
                r.style.top = (e.clientY - rect.top - size / 2) + 'px';
                btn.appendChild(r);
                setTimeout(function () { r.remove(); }, 700);
            });

            form.addEventListener('submit', function (e) {
                if (submitting) { e.preventDefault(); return; }   // ikki marta bosishdan himoya
                submitting = true;
                btn.classList.add('is-loading');
                btn.setAttribute('aria-busy', 'true');
                label.textContent = 'Kirilmoqda…';
                playClickSound();
                if (navigator.vibrate) navigator.vibrate(18);
            });

            // "Orqaga" tugmasi bilan qaytilganda (bfcache) tugma qotib qolmasin
            window.addEventListener('pageshow', function () {
                submitting = false;
                btn.classList.remove('is-loading');
                btn.removeAttribute('aria-busy');
                label.textContent = originalText;
            });
        })();
    </script>

    <script>
        // Agar sahifa Telegram Mini App ichida ochilgan bo'lsa va Telegram
        // bizga foydalanuvchi identifikatsiyasini (initData) bergan bo'lsa —
        // PIN so'ramasdan, avtomatik kirishga urinamiz. Muvaffaqiyatsiz
        // bo'lsa (masalan hali botda ro'yxatdan o'tmagan), oddiy PIN
        // formasi ko'rinishda qolaveradi — hech narsa buzilmaydi.
        (async () => {
            if (!tg || !tg.initData) return;

            document.getElementById('login-form-wrapper').hidden = true;
            document.getElementById('auto-login-status').hidden = false;

            try {
                const res = await fetch('/telegram-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: tg.initData, next: "{{ next_url }}" }),
                });
                const data = await res.json();
                if (data.ok && data.redirect) {
                    window.location.href = data.redirect;
                    return;
                }
            } catch (e) {
                console.error('Avtomatik kirish xatosi:', e);
            }

            // Avtomatik kirish ishlamadi — oddiy formani qayta ko'rsatamiz
            document.getElementById('auto-login-status').hidden = true;
            document.getElementById('login-form-wrapper').hidden = false;
        })();
    </script>
</body>
</html>
