<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eltuvchi Express</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Swiper.js Slider -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Leaflet — kuryerni jonli kuzatish xaritasi uchun -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/js/ui-mode.js"></script>
    <style>
        body.theme-default { background-color: #f8fafc; color: #0f172a; }
        body.theme-dark { background-color: #05060a; color: #f8fafc; }
        body.theme-gold { background-color: #fefce8; color: #422006; }
        body.theme-green { background-color: #f0fdf4; color: #052e16; }
        body.theme-ocean { background-color: #f0f9ff; color: #0c4a6e; }
        body.theme-rose { background-color: #fff1f2; color: #4c0519; }

        body.theme-ocean .card-bg { background-color: #ffffff; border-color: #bae6fd; }
        body.theme-ocean .text-title { color: #0c4a6e; }
        body.theme-ocean .text-sub { color: #0369a1; }
        body.theme-rose .card-bg { background-color: #ffffff; border-color: #fecdd3; }
        body.theme-rose .text-title { color: #881337; }
        body.theme-rose .text-sub { color: #be123c; }

        body.theme-dark .card-bg { background-color: #1e293b; border-color: #334155; }
        body.theme-dark .text-title { color: #f8fafc; }
        body.theme-dark .text-sub { color: #94a3b8; }
        
        body.theme-gold .card-bg { background-color: #fffbeb; border-color: #fef08a; }
        body.theme-gold .text-title { color: #713f12; }
        body.theme-gold .text-sub { color: #a16207; }

        body.theme-green .card-bg { background-color: #ffffff; border-color: #bbf7d0; }
        body.theme-green .text-title { color: #14532d; }
        body.theme-green .text-sub { color: #15803d; }

        body.theme-default .card-bg { background-color: #ffffff; border-color: #f1f5f9; }
        body.theme-default .text-title { color: #0f172a; }
        body.theme-default .text-sub { color: #64748b; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .swiper-pagination-bullet-active { background: #f59e0b !important; }

        /* ============================================================
           ULTRA-PREMIUM "OBSIDIAN GLASS" QATLAMI — faqat theme-dark
           (endi STANDART tema) uchun kuchaytiriladi. Boshqa 3 tema
           (Standart/Oltin/Yashil) o'zgarishsiz, tanlov sifatida qoladi.
           ============================================================ */
        body.theme-dark, body.theme-dark * { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
        body.theme-dark {
            background:
                radial-gradient(ellipse 800px 500px at 15% -5%, rgba(245,158,11,.10), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 20%, rgba(99,102,241,.12), transparent 60%),
                #05060a !important;
        }

        .premium-orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0; pointer-events: none; z-index: 0; transition: opacity .6s ease; }
        body.theme-dark .premium-orb { opacity: .28; }
        .premium-orb-1 { width: 360px; height: 360px; background: radial-gradient(circle, #f59e0b, transparent 70%); top: -100px; left: -80px; animation: pOrb1 20s ease-in-out infinite; }
        .premium-orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, #6366f1, transparent 70%); bottom: -100px; right: -70px; animation: pOrb2 24s ease-in-out infinite; }
        @keyframes pOrb1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,50px); } }
        @keyframes pOrb2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-40px); } }

        body.theme-dark .card-bg {
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)) !important;
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid rgba(255,255,255,.09) !important;
            box-shadow: 0 16px 40px -18px rgba(0,0,0,.7);
        }

        /* Header, tema menyusi, savat paneli va kuzatuv oynasi — avval
           doim OQ fon bilan qattiq yozilgan edi (tema o'zgarganda ham
           o'zgarmasdi). Endi dark tanlanganda ular ham shisha uslubga
           o'tadi. */
        body.theme-dark #app-header {
            background: linear-gradient(90deg, rgba(15,16,26,.85), rgba(20,18,35,.85)) !important;
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.08) !important;
        }
        body.theme-dark #app-header .bg-slate-100 { background: rgba(255,255,255,.08) !important; color: #e2e8f0 !important; }
        body.theme-dark #app-header .text-slate-900 { color: #f1f5f9 !important; }
        body.theme-dark #theme-menu { background: #12131e !important; border-color: rgba(255,255,255,.08) !important; }
        body.theme-dark #cart-bar { background: linear-gradient(135deg, #12131e, #1a1b2e) !important; border-color: rgba(255,255,255,.1) !important; box-shadow: 0 20px 50px -15px rgba(0,0,0,.8), 0 0 0 1px rgba(245,158,11,.15); }
        body.theme-dark #splash-screen { background: #05060a !important; }

        .text-grad-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }

        .fade-up { animation: fadeUp .55s cubic-bezier(.2,.7,.2,1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        body.theme-dark ::-webkit-scrollbar { width: 6px; height: 6px; }
        body.theme-dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }

        .leaflet-marker-icon { transition: transform 1.1s linear; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #12131e; color: #e5e7eb; }


        /* ============================================================
           OCHIQ MAVZULAR — Standart / Oltin / Yashil / Okean / Atirgul
           Yumshoq gradient fon, "shisha" kartochkalar, rangli header,
           savat paneli va tugmalar — har bir mavzu o'z jozibasi bilan.
           ============================================================ */
        body.theme-default { --a1:#6366f1; --a2:#8b5cf6; --wash1:rgba(99,102,241,.13);  --wash2:rgba(245,158,11,.10);  --shadow:30,41,90; }
        body.theme-gold    { --a1:#f59e0b; --a2:#ea580c; --wash1:rgba(245,158,11,.20);  --wash2:rgba(234,179,8,.14);   --shadow:120,72,10; }
        body.theme-green   { --a1:#10b981; --a2:#0d9488; --wash1:rgba(16,185,129,.18);  --wash2:rgba(132,204,22,.12);  --shadow:10,80,50; }
        body.theme-ocean   { --a1:#0ea5e9; --a2:#2563eb; --wash1:rgba(14,165,233,.18);  --wash2:rgba(99,102,241,.12);  --shadow:10,60,110; }
        body.theme-rose    { --a1:#f43f5e; --a2:#db2777; --wash1:rgba(244,63,94,.16);   --wash2:rgba(251,146,60,.12);  --shadow:120,20,50; }

        body.theme-default, body.theme-gold, body.theme-green, body.theme-ocean, body.theme-rose {
            background-image:
                radial-gradient(ellipse 700px 420px at 0% -6%, var(--wash1), transparent 62%),
                radial-gradient(ellipse 640px 420px at 100% 4%, var(--wash2), transparent 62%);
            background-attachment: fixed;
        }
        body.theme-default .card-bg, body.theme-gold .card-bg, body.theme-green .card-bg,
        body.theme-ocean .card-bg, body.theme-rose .card-bg {
            border-radius: 1.25rem !important;
            box-shadow: 0 18px 40px -24px rgba(var(--shadow), .35), 0 2px 6px -2px rgba(var(--shadow), .08) !important;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        body.theme-default #app-header, body.theme-gold #app-header, body.theme-green #app-header,
        body.theme-ocean #app-header, body.theme-rose #app-header {
            background: linear-gradient(100deg, color-mix(in srgb, var(--a1) 14%, white), color-mix(in srgb, var(--a2) 10%, white)) !important;
            border-bottom: 1px solid color-mix(in srgb, var(--a1) 22%, transparent) !important;
            box-shadow: 0 10px 30px -18px rgba(var(--shadow), .5) !important;
        }
        body.theme-default #theme-menu, body.theme-gold #theme-menu, body.theme-green #theme-menu,
        body.theme-ocean #theme-menu, body.theme-rose #theme-menu { background: rgba(255,255,255,.95) !important; backdrop-filter: blur(12px); }
        body.theme-default #cart-bar, body.theme-gold #cart-bar, body.theme-green #cart-bar,
        body.theme-ocean #cart-bar, body.theme-rose #cart-bar {
            background: linear-gradient(135deg, var(--a1), var(--a2)) !important;
            border-color: rgba(255,255,255,.35) !important;
            box-shadow: 0 20px 40px -14px color-mix(in srgb, var(--a1) 70%, transparent) !important;
        }
        body.theme-default #cart-bar .text-amber-400, body.theme-gold #cart-bar .text-amber-400, body.theme-green #cart-bar .text-amber-400,
        body.theme-ocean #cart-bar .text-amber-400, body.theme-rose #cart-bar .text-amber-400 { color: rgba(255,255,255,.85) !important; }
        body.theme-default #cart-bar .bg-amber-500, body.theme-gold #cart-bar .bg-amber-500, body.theme-green #cart-bar .bg-amber-500,
        body.theme-ocean #cart-bar .bg-amber-500, body.theme-rose #cart-bar .bg-amber-500 { background: rgba(255,255,255,.22) !important; box-shadow: none !important; }
        /* Asosiy tugmalar (amber) — mavzu rangiga moslashadi */
        body.theme-green .bg-amber-500, body.theme-ocean .bg-amber-500, body.theme-rose .bg-amber-500 { background-image: linear-gradient(135deg, var(--a1), var(--a2)); background-color: transparent !important; }
        body.theme-green .hover\:bg-amber-600:hover, body.theme-ocean .hover\:bg-amber-600:hover, body.theme-rose .hover\:bg-amber-600:hover { filter: brightness(1.08); }
        body.theme-green .text-amber-600, body.theme-green .text-amber-500 { color: #059669 !important; }
        body.theme-ocean .text-amber-600, body.theme-ocean .text-amber-500 { color: #0284c7 !important; }
        body.theme-rose .text-amber-600, body.theme-rose .text-amber-500 { color: #e11d48 !important; }
        body.theme-green .bg-amber-50 { background-color: rgba(16,185,129,.12) !important; }
        body.theme-ocean .bg-amber-50 { background-color: rgba(14,165,233,.12) !important; }
        body.theme-rose .bg-amber-50 { background-color: rgba(244,63,94,.1) !important; }
        body.theme-gold .bg-amber-500 { background-image: linear-gradient(135deg, #f59e0b, #ea580c); background-color: transparent !important; }
        body.theme-default .swiper, body.theme-gold .swiper, body.theme-green .swiper, body.theme-ocean .swiper, body.theme-rose .swiper {
            box-shadow: 0 22px 44px -24px rgba(var(--shadow), .55);
        }

        /* Kategoriya belgilarining tanlangan holati (amber) — glass fonda ham yaxshi ko'rinishi uchun */
        body.theme-dark .category-chip-active { box-shadow: 0 8px 20px -6px rgba(245,158,11,.55); }

        /* Ba'zi kichik nishonlar (masalan shahar belgisi) och-sariq fonda
           edi — qorong'i fonda "yuvilib ketgan" ko'rinmasligi uchun. */
        body.theme-dark .bg-amber-50 { background-color: rgba(245,158,11,.14) !important; }
        body.theme-dark .bg-amber-100 { background-color: rgba(245,158,11,.22) !important; }
        body.theme-dark .hover\:bg-amber-100:hover { background-color: rgba(245,158,11,.3) !important; }
        body.theme-dark .text-amber-600 { color: #fbbf24 !important; }
        body.theme-dark .bg-slate-500\/10 { background-color: rgba(255,255,255,.06) !important; }
    </style>
    <link rel="stylesheet" href="/static/css/light-mode.css">
</head>
<body id="main-body" class="theme-default min-h-screen antialiased selection:bg-amber-500 selection:text-white pb-32 transition-colors duration-300">

    <div class="premium-orb premium-orb-1"></div>
    <div class="premium-orb premium-orb-2"></div>

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-500">
        <div class="relative mb-6">
            <div class="absolute -inset-1 bg-gradient-to-r from-amber-500 to-amber-300 rounded-full blur opacity-50 animate-pulse"></div>
            <img src="/static/images/logo.png" onerror="this.src='https://via.placeholder.com/120?text=Eltuvchi'" alt="Eltuvchi Express Logo" class="relative w-28 h-28 object-contain rounded-3xl shadow-2xl bg-white p-2">
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight mb-2">Eltuvchi Express</h1>
        <p class="text-xs font-semibold text-amber-400 max-w-xs leading-relaxed mb-8">Tezkor va ishonchli yetkazib berish xizmati</p>
        <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 shadow-sm transition-colors duration-300" id="app-header">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5 cursor-pointer" onclick="goHome()">
                <img src="/static/images/logo.png" onerror="this.style.display='none'" alt="Logo" class="w-9 h-9 object-contain rounded-xl">
                <div>
                    <div class="font-black text-base text-slate-900 tracking-tight leading-none">ELTUVCHI</div>
                    <div class="text-[10px] font-extrabold text-amber-500 tracking-widest leading-none mt-0.5">EXPRESS</div>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="renderFavorites()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95 relative">
                    <i class="fa-solid fa-heart text-rose-500 text-sm"></i>
                    <span id="fav-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
                <button type="button" data-mode-toggle class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95 text-sm" aria-label="Rejim"></button>
                <button onclick="toggleThemeMenu()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95">
                    <i class="fa-solid fa-palette text-sm"></i>
                </button>
                <button id="profile-btn" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-2xl flex items-center justify-center transition-all active:scale-95" onclick="openProfile()">
                    <i class="fa-solid fa-user-gear text-sm"></i>
                </button>
            </div>
        </div>

        <div id="theme-menu" class="hidden bg-white border-t border-slate-100 px-4 py-3 flex flex-wrap justify-around items-center gap-2 text-xs font-bold shadow-inner">
            <button onclick="setTheme('theme-default')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                <span class="w-3 h-3 rounded-full bg-slate-200 border"></span>
                <span>Standart</span>
            </button>
            <button onclick="setTheme('theme-dark')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-slate-800 text-white">
                <span class="w-3 h-3 rounded-full bg-slate-900"></span>
                <span>Tungi</span>
            </button>
            <button onclick="setTheme('theme-gold')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-amber-100 text-amber-900">
                <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                <span>Oltin</span>
            </button>
            <button onclick="setTheme('theme-green')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-emerald-100 text-emerald-900">
                <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                <span>Yashil</span>
            </button>
            <button onclick="setTheme('theme-ocean')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-sky-100 text-sky-900">
                <span class="w-3 h-3 rounded-full bg-sky-500"></span>
                <span>Okean</span>
            </button>
            <button onclick="setTheme('theme-rose')" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-rose-100 text-rose-900">
                <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                <span>Atirgul</span>
            </button>
        </div>
    </header>

    <!-- Asosiy Konteyner -->
    <main id="app" class="max-w-md mx-auto p-4 space-y-3">
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-3">
            <div class="w-9 h-9 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs font-semibold text-slate-400">Yuklanmoqda...</p>
        </div>
    </main>

    <!-- KURYERNI JONLI KUZATISH — buyurtma "Yo'lda" bo'lganda ochiladi. DIQQAT:
         bu #app'DAN TASHQARIDA joylashgan — chunki openProfile() va boshqa
         funksiyalar #app.innerHTML'ni to'liq almashtirib turadi; agar shu
         oyna #app ichida bo'lganida, sahifa almashganda u ham yo'qolib
         qolardi. -->
    <div id="tracking-overlay" class="hidden fixed inset-0 z-40 bg-slate-900/95 flex flex-col">
        <div class="flex items-center justify-between p-4 border-b border-white/10">
            <div>
                <h2 class="text-sm font-black text-white">🛵 Buyurtma #<span id="tracking-order-id"></span></h2>
                <p id="tracking-courier-info" class="text-[11px] text-slate-400 mt-0.5">Kuryer qidirilmoqda...</p>
            </div>
            <button onclick="closeOrderTracking()" class="text-white bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="tracking-map" class="flex-1"></div>
        <div class="p-3 bg-slate-900 border-t border-white/10 text-center">
            <p id="tracking-status-text" class="text-[11px] text-slate-400">Joylashuv har 6 soniyada yangilanadi</p>
        </div>
    </div>

    <!-- Savat Paneli -->
    <div id="cart-bar" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer transition-all duration-300 active:scale-95 z-50 border border-slate-800" onclick="openCart()">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold shadow-md shadow-amber-500/30">
                <i class="fa-solid fa-basket-shopping text-sm"></i>
            </div>
            <div>
                <span id="cart-summary" class="font-black text-sm block leading-tight"></span>
                <span class="text-[11px] text-amber-400 font-medium">Buyurtmani rasmiylashtirish →</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const initData = tg ? tg.initData : "";

        let currentUser = null;
        let currentCityId = null;
        let currentCityName = "Shaharni tanlang";
        let allCities = [];
        let currentPartnerId = null;
        let currentPartnerName = "";
        let products = [];
        let cart = {};

        let favorites = JSON.parse(localStorage.getItem('fav_items') || '[]');
        let orderType = 'delivery'; 
        let paymentMethod = 'cash'; // Real to'lovlar: 'cash', 'click', 'payme'
        let promoCode = '';
        let promoDiscountPercent = 0;
        let orderComment = '';
        let userLocation = null;

        let selectedCategory = "Barchasi";
        let searchQuery = "";
        let useCashback = false; // Keshbek to'lov usuli emas, chegirma opsiyasi

        function setTheme(themeName) {
            document.getElementById("main-body").className = `${themeName} min-h-screen antialiased selection:bg-amber-500 selection:text-white pb-32 transition-colors duration-300`;
            localStorage.setItem("app_theme", themeName);
            if (themeName !== "theme-dark") localStorage.setItem("app_light_theme", themeName);
            // Light/Dark rejim bilan sinxronlash (ui-mode.js)
            if (window.UIMode) { window.__themeSync = true; UIMode.set(themeName === "theme-dark" ? "dark" : "light"); window.__themeSync = false; }
            document.getElementById("theme-menu").classList.add("hidden");
        }

        function toggleThemeMenu() {
            document.getElementById("theme-menu").classList.toggle("hidden");
        }

        // Boshlang'ich mavzu umumiy Light/Dark rejimga (ui-mode.js) mos tanlanadi
        let savedTheme;
        if (window.UIMode && UIMode.get() === "dark") {
            savedTheme = "theme-dark";
        } else {
            savedTheme = localStorage.getItem("app_light_theme") || localStorage.getItem("app_theme");
            if (!savedTheme || savedTheme === "theme-dark") savedTheme = "theme-default";
        }
        setTheme(savedTheme);
        document.addEventListener("uimodechange", function (e) {
            if (window.__themeSync) return;
            const isDark = document.getElementById("main-body").classList.contains("theme-dark");
            if (e.detail.mode === "dark" && !isDark) setTheme("theme-dark");
            else if (e.detail.mode === "light" && isDark) setTheme(localStorage.getItem("app_light_theme") || "theme-default");
        });

        async function api(path, body) {
            const res = await fetch(`/api/shop${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ init_data: initData, ...body }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: "Xatolik" }));
                throw new Error(err.detail || "Xatolik yuz berdi");
            }
            return res.json();
        }

        async function apiGet(path) {
            const separator = path.includes('?') ? '&' : '?';
            const res = await fetch(`/api/shop${path}${separator}init_data=${encodeURIComponent(initData)}`);
            if (!res.ok) throw new Error("Xatolik yuz berdi");
            return res.json();
        }

        // ==================== KURYERNI JONLI KUZATISH ====================
        let trackingMap = null;
        let trackingCourierMarker = null;
        let trackingPartnerMarker = null;
        let trackingPollTimer = null;
        let trackingOrderId = null;

        function escTrack(v) {
            if (v === null || v === undefined) return '';
            return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function openOrderTracking(orderId) {
            trackingOrderId = orderId;
            document.getElementById('tracking-order-id').textContent = orderId;
            document.getElementById('tracking-overlay').classList.remove('hidden');

            if (!trackingMap && typeof L !== 'undefined') {
                trackingMap = L.map('tracking-map').setView([41.5504, 60.6318], 13);
                const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO'
                });
                const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO'
                });
                const streetsLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '&copy; OpenStreetMap'
                });
                const satelliteLayer = L.tileLayer(
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                    { maxZoom: 19, attribution: 'Tiles &copy; Esri' }
                );
                L.control.layers({ '🌑 Tungi': darkLayer, '☀️ Yorug‘': lightLayer, '🗺️ Sxema': streetsLayer, '🛰️ Sputnik': satelliteLayer }, {}, { position: 'topright', collapsed: true }).addTo(trackingMap);
                if (window.UIMode) { UIMode.attachMapTheme(trackingMap, darkLayer, lightLayer); } else { darkLayer.addTo(trackingMap); }
            }
            setTimeout(() => { if (trackingMap) trackingMap.invalidateSize(); }, 100);

            pollOrderTracking();
            if (trackingPollTimer) clearInterval(trackingPollTimer);
            trackingPollTimer = setInterval(pollOrderTracking, 6000);
        }

        function closeOrderTracking() {
            document.getElementById('tracking-overlay').classList.add('hidden');
            if (trackingPollTimer) { clearInterval(trackingPollTimer); trackingPollTimer = null; }
            trackingOrderId = null;
        }

        // Kuryerning transport turiga qarab xaritadagi belgisi o'zgaradi
        // (piyoda/velosiped/skuter/avtomobil) — bo'lmasa odatiy mototsikl.
        const TRACK_TRANSPORT_EMOJI = { walking: '🚶', bicycle: '🚲', scooter: '🛴', car: '🚗' };
        function getMotorbikeIcon(transport) {
            const emoji = TRACK_TRANSPORT_EMOJI[transport] || '🛵';
            return L.divIcon({
                html: `<div style="background:#4f46e5; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); font-size:15px;">${emoji}</div>`,
                className: '', iconSize: [30, 30], iconAnchor: [15, 15],
            });
        }
        function getShopIcon() {
            return L.divIcon({
                html: '<div style="background:#f59e0b; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); font-size:12px;">🏪</div>',
                className: '', iconSize: [24, 24], iconAnchor: [12, 12],
            });
        }

        async function pollOrderTracking() {
            if (!trackingOrderId) return;
            try {
                const data = await apiGet(`/orders/${trackingOrderId}/track`);
                const infoEl = document.getElementById('tracking-courier-info');
                const statusEl = document.getElementById('tracking-status-text');
                if (!infoEl || !statusEl) return;

                if (data.status !== 'on_the_way') {
                    infoEl.textContent = data.status === 'delivered' ? "✅ Buyurtma yetkazildi!" : "Buyurtma holati o'zgardi";
                    statusEl.textContent = '';
                    if (trackingPollTimer) { clearInterval(trackingPollTimer); trackingPollTimer = null; }
                    if (data.status === 'delivered') setTimeout(closeOrderTracking, 2500);
                    return;
                }

                infoEl.textContent = data.courier_name ? `${data.courier_name} — ${data.courier_phone || ''}` : 'Kuryer belgilandi';

                if (!trackingMap) return; // Leaflet yuklanmagan bo'lishi mumkin (tarmoq muammosi) — xavfsiz chiqamiz

                if (data.partner_location && !trackingPartnerMarker) {
                    trackingPartnerMarker = L.marker([data.partner_location.lat, data.partner_location.lng], { icon: getShopIcon() })
                        .addTo(trackingMap).bindPopup(escTrack(data.partner_name || "Do'kon"));
                }

                if (data.courier_location) {
                    const pos = [data.courier_location.lat, data.courier_location.lng];
                    if (trackingCourierMarker) {
                        trackingCourierMarker.setLatLng(pos);
                        trackingCourierMarker.setIcon(getMotorbikeIcon(data.courier_transport));
                    } else {
                        trackingCourierMarker = L.marker(pos, { icon: getMotorbikeIcon(data.courier_transport) }).addTo(trackingMap);
                    }
                    const bounds = [pos];
                    if (trackingPartnerMarker) bounds.push(trackingPartnerMarker.getLatLng());
                    if (bounds.length > 1) trackingMap.fitBounds(bounds, { padding: [50, 80] });
                    else trackingMap.setView(pos, 15);
                    statusEl.textContent = '📍 Joylashuv yangilandi — ' + new Date().toLocaleTimeString('uz-UZ');
                } else {
                    statusEl.textContent = "Kuryerning GPS signali hozircha yo'q — biroz kuting";
                }
            } catch (e) {
                console.error('Kuryerni kuzatishda xatolik', e);
            }
        }

                            <span class="w-2 h-2 rounded-full ${isOpen ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        </div>
                        <span class="text-[9px] uppercase font-bold tracking-wider ${isOpen ? 'bg-emerald-500/10 text-emerald-600' : 'bg-rose-500/10 text-rose-600'} px-2 py-0.5 rounded-md">
                            ${isOpen ? 'Ochiq' : 'Hozir Yopiq'}
                        </span>
                    </div>
                    <div class="text-xs text-sub flex items-center space-x-1">
                        <i class="fa-solid fa-map-pin text-[10px]"></i>
                        <span class="truncate">${p.address || "Manzil ko'rsatilmagan"}</span>
                    </div>`;
                
                if (isOpen) {
                    card.onclick = () => loadProducts(p.id, p.name);
                }
                list.appendChild(card);
            });
            updateCartBar();
        }

        async function changeCityPrompt() {
            if (allCities.length === 0 && currentUser) {
                allCities = currentUser.cities || [];
            }
            renderCitySelect(allCities);
        }

        async function loadProducts(partnerId, partnerName) {
            currentPartnerId = partnerId;
            currentPartnerName = partnerName;
            renderLoading("Menyu yuklanmoqda...");
            products = await apiGet(`/products?partner_id=${partnerId}`);

            selectedCategory = "Barchasi";
            searchQuery = "";

            renderProductInterface();
            updateCartBar();
        }

        function renderProductInterface() {
            const app = document.getElementById("app");
            const categories = ["Barchasi", ...new Set(products.map(p => p.category || "Boshqa"))];

            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl mb-3" onclick="loadPartners()">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Do'konlarga qaytish
                </button>
                <h1 class="text-xl font-black text-title mb-3">${currentPartnerName}</h1>
                
                <div class="relative mb-3">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sub text-xs"></i>
                    <input id="search-input" type="text" value="${searchQuery}" placeholder="Mahsulotlarni izlash..." class="w-full pl-9 pr-3 py-2.5 card-bg border rounded-2xl text-xs font-medium text-title focus:outline-none focus:border-amber-500 transition-all shadow-sm">
                </div>

                <div class="flex space-x-2 overflow-x-auto no-scrollbar mb-4 pb-1" id="category-bar">
                    ${categories.map(cat => `
                        <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-amber-500 text-white shadow-sm shadow-amber-200' : 'card-bg border text-sub hover:text-title'}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>

                <div class="space-y-2.5" id="product-list"></div>`;

            document.getElementById("search-input").addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase();
                filterAndRenderProducts();
            });

            filterAndRenderProducts();
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderProductInterface();
        }

        function filterAndRenderProducts() {
            const list = document.getElementById("product-list");
            if (!list) return;

            const filtered = products.filter(p => {
                const matchesCat = selectedCategory === "Barchasi" || (p.category || "Boshqa") === selectedCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || (p.description && p.description.toLowerCase().includes(searchQuery));
                return matchesCat && matchesSearch;
            });

            list.innerHTML = "";

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 card-bg rounded-2xl border border-dashed p-4">
                        <i class="fa-solid fa-box-open text-2xl text-sub mb-2"></i>
                        <p class="text-xs text-sub font-medium">Mahsulot topilmadi.</p>
                    </div>`;
                updateCartBar();
                return;
            }

            filtered.forEach(p => {
                const qty = cart[p.id]?.qty || 0;
                const isFav = favorites.includes(p.id);
                const imgUrl = p.image_url || `https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=80`;

                const row = document.createElement("div");
                row.className = "p-3 card-bg rounded-2xl shadow-sm border flex items-center space-x-3";
                row.innerHTML = `
                    <img src="${imgUrl}" loading="lazy" alt="${p.name}" class="w-16 h-16 object-cover rounded-xl bg-slate-100 flex-shrink-0">
                    
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <div class="font-bold text-xs text-title truncate pr-1">${p.name}</div>
                            <button onclick="toggleFav(${p.id})" class="text-xs ${isFav ? 'text-rose-500' : 'text-slate-300'}">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                        </div>
                        <div class="text-[11px] text-sub line-clamp-1 mt-0.5">${p.description || ""}</div>
                        <div class="text-xs font-black text-amber-600 mt-1">${Number(p.price).toLocaleString()} so'm</div>
                    </div>

                    <div class="flex-shrink-0 flex items-center">
                        ${qty === 0 ? `
                            <button class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm shadow-amber-200 transition-all active:scale-95" onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
                                + Qo'shish
                            </button>
                        ` : `
                            <div class="flex items-center space-x-1.5 bg-slate-500/10 p-1 rounded-xl">
                                <button onclick="changeQty(${p.id}, -1)" class="w-6 h-6 bg-white rounded-lg text-xs font-bold text-title shadow-sm flex items-center justify-center">−</button>
                                <span class="text-xs font-bold w-4 text-center text-title">${qty}</span>
                                <button onclick="changeQty(${p.id}, 1)" class="w-6 h-6 bg-amber-500 rounded-lg text-xs font-bold text-white shadow-sm flex items-center justify-center">+</button>
                            </div>
                        `}
                    </div>`;
                list.appendChild(row);
            });
            updateCartBar();
        }

        function addToCart(product) {
            if (!cart[product.id]) cart[product.id] = { product, qty: 0 };
            cart[product.id].qty += 1;
            filterAndRenderProducts();
        }

        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(i => i !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('fav_items', JSON.stringify(favorites));
            filterAndRenderProducts();
            updateFavBadge();
        }

        function updateFavBadge() {
            const badge = document.getElementById("fav-badge");
            if (favorites.length > 0) {
                badge.textContent = favorites.length;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        function renderFavorites() {
            const app = document.getElementById("app");
            const favProducts = products.filter(p => favorites.includes(p.id));

            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl mb-3" onclick="goHome()">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Qaytish
                </button>
                <h1 class="text-xl font-black text-title mb-3">❤️ Sevimlilar</h1>
                <div class="space-y-2.5" id="fav-list"></div>`;

            const list = document.getElementById("fav-list");
            if (favProducts.length === 0) {
                list.innerHTML = `<p class="text-xs text-sub text-center py-8">Sevimlilar ro'yxati bo'sh.</p>`;
                return;
            }

            favProducts.forEach(p => {
                const row = document.createElement("div");
                row.className = "p-3 card-bg rounded-2xl shadow-sm border flex items-center justify-between";
                row.innerHTML = `
                    <div class="font-bold text-xs text-title">${p.name}</div>
                    <div class="text-xs font-black text-amber-600">${Number(p.price).toLocaleString()} so'm</div>`;
                list.appendChild(row);
            });
        }

        function updateCartBar() {
            const items = Object.values(cart);
            const bar = document.getElementById("cart-bar");
            if (items.length === 0) { 
                bar.classList.add("hidden"); 
                return; 
            }
            const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
            const count = items.reduce((s, i) => s + i.qty, 0);
            document.getElementById("cart-summary").textContent = `${count} ta mahsulot — ${total.toLocaleString()} so'm`;
            bar.classList.remove("hidden");
        }

        // SAVATCHA OYNASI (Alohida keshbek bloki va to'lov turlari bilan)
        function openCart() {
            const items = Object.values(cart);
            if (items.length === 0) return;

            document.getElementById("cart-bar").classList.add("hidden");
            const app = document.getElementById("app");
            const originalTotal = items.reduce((s, i) => s + i.product.price * i.qty, 0);

            const promoDiscount = Math.round((originalTotal * promoDiscountPercent) / 100);
            const totalAfterPromo = originalTotal - promoDiscount;

            // Keshbek hisobi
            const userCashback = currentUser?.cashback_balance || 0;
            const canUseCashback = userCashback > 0;

            let cashbackDiscount = 0;
            if (useCashback && canUseCashback) {
                cashbackDiscount = Math.min(userCashback, totalAfterPromo);
            }
            const finalTotal = Math.max(0, totalAfterPromo - cashbackDiscount);

            app.innerHTML = `
                <button class="flex items-center text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl mb-3" onclick="loadProducts(currentPartnerId, currentPartnerName)">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Menyuga qaytish
                </button>
                <h1 class="text-xl font-black text-title mb-3">🛒 Savatingiz</h1>

                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="setOrderType('delivery')" class="p-3 rounded-2xl text-xs font-bold border transition-all ${orderType === 'delivery' ? 'bg-amber-500 text-white border-amber-500' : 'card-bg text-sub'}">
                        🚕 Yetkazib berish
                    </button>
                    <button onclick="setOrderType('pickup')" class="p-3 rounded-2xl text-xs font-bold border transition-all ${orderType === 'pickup' ? 'bg-amber-500 text-white border-amber-500' : 'card-bg text-sub'}">
                        🏃‍♂️ Olib ketish
                    </button>
                </div>

                <div class="space-y-2 mb-4" id="cart-items"></div>
                
                <div class="card-bg p-4 rounded-2xl shadow-sm border mb-4 space-y-3">
                    ${orderType === 'delivery' ? `
                    <div>
                        <label class="block text-xs font-bold text-title mb-1">Yetkazib berish manzili</label>
                        <div class="flex space-x-2">
                            <input id="delivery-address" type="text" placeholder="Masalan: Navoiy ko'chasi, 12-uy" class="flex-1 p-2.5 bg-slate-500/10 border rounded-xl text-xs font-medium text-title focus:outline-none focus:border-amber-500 transition-all">
                            <button onclick="getLocation()" class="bg-amber-500 text-white px-3 rounded-xl text-xs font-bold flex items-center justify-center active:scale-95" title="Geolokatsiyani aniqlash">
                                <i class="fa-solid fa-location-crosshairs"></i>
                            </button>
                        </div>
                        <div id="location-status" class="text-[10px] text-emerald-600 font-bold mt-1"></div>
                    </div>
                    ` : ''}

                    <div class="border-t border-slate-100/10 pt-3">
                        <label class="block text-xs font-bold text-title mb-1">Promo-kod</label>
                        <div class="flex space-x-2">
                            <input id="promo-input" type="text" value="${promoCode}" placeholder="Masalan: PROMO10" class="flex-1 p-2.5 bg-slate-500/10 border rounded-xl text-xs font-bold text-title uppercase focus:outline-none">
                            <button onclick="applyPromoCode()" class="bg-slate-900 text-white px-4 rounded-xl text-xs font-bold active:scale-95 transition-all">
                                Qo'llash
                            </button>
                        </div>
                        ${promoDiscountPercent > 0 ? `<p class="text-[10px] text-emerald-600 font-bold mt-1">✓ ${promoDiscountPercent}% chegirma qo'llanildi!</p>` : ''}
                    </div>

                    <div class="border-t border-slate-100/10 pt-3">
                        <label class="block text-xs font-bold text-title mb-1">Buyurtma uchun izoh</label>
                        <textarea id="order-comment" rows="2" placeholder="Masalan: Podyezd kodi 123..." class="w-full p-2.5 bg-slate-500/10 border rounded-xl text-xs font-medium text-title focus:outline-none">${orderComment}</textarea>
                    </div>

                    <!-- REAL TO'LOV TURLARI -->
                    <div class="border-t border-slate-100/10 pt-3">
                        <label class="block text-xs font-bold text-title mb-1.5">To'lov usuli</label>
                        <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                            <button onclick="setPayment('cash')" class="p-2 rounded-xl border flex flex-col items-center justify-center space-y-1 ${paymentMethod === 'cash' ? 'border-amber-500 bg-amber-50 text-amber-900' : 'border-slate-200'}">
                                <i class="fa-solid fa-money-bill-wave text-emerald-600 text-sm"></i>
                                <span>Naqd</span>
                            </button>
                            <button onclick="setPayment('click')" class="p-2 rounded-xl border flex flex-col items-center justify-center space-y-1 ${paymentMethod === 'click' ? 'border-amber-500 bg-amber-50 text-amber-900' : 'border-slate-200'}">
                                <i class="fa-solid fa-mobile-screen text-blue-500 text-sm"></i>
                                <span>Click</span>
                            </button>
                            <button onclick="setPayment('payme')" class="p-2 rounded-xl border flex flex-col items-center justify-center space-y-1 ${paymentMethod === 'payme' ? 'border-amber-500 bg-amber-50 text-amber-900' : 'border-slate-200'}">
                                <i class="fa-solid fa-credit-card text-cyan-500 text-sm"></i>
                                <span>Payme</span>
                            </button>
                        </div>
                    </div>

                    <!-- KESHBEKDAN FOYDALANISH ALOHIDA QISM -->
                    <div class="border-t border-slate-100/10 pt-3 flex justify-between items-center bg-amber-500/5 p-3 rounded-2xl border border-amber-500/20">
                        <div>
                            <div class="text-xs font-bold text-title flex items-center space-x-1.5">
                                <i class="fa-solid fa-coins text-amber-500 text-sm"></i>
                                <span>Keshbekdan foydalanish</span>
                            </div>
                            <div class="text-[10px] font-semibold text-sub mt-0.5">Mavjud keshbek: <span class="font-extrabold text-amber-600">${userCashback.toLocaleString()} so'm</span></div>
                        </div>
                        ${canUseCashback ? `
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="cashback-toggle" class="sr-only peer" ${useCashback ? 'checked' : ''} onchange="toggleCashbackUse(this.checked)">
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                        </label>
                        ` : `
                        <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-lg">Mavjud emas</span>
                        `}
                    </div>

                    <div class="border-t border-slate-100/10 pt-3 space-y-1">
                        <div class="flex justify-between items-center text-xs text-sub">
                            <span>Mahsulotlar summasi:</span>
                            <span>${originalTotal.toLocaleString()} so'm</span>
                        </div>
                        ${promoDiscount > 0 ? `
                        <div class="flex justify-between items-center text-xs text-emerald-600 font-bold">
                            <span>Promo-kod chegirmasi:</span>
                            <span>-${promoDiscount.toLocaleString()} so'm</span>
                        </div>
                        ` : ''}
                        ${useCashback && cashbackDiscount > 0 ? `
                        <div class="flex justify-between items-center text-xs text-emerald-600 font-bold">
                            <span>Keshbek chegirmasi:</span>
                            <span>-${cashbackDiscount.toLocaleString()} so'm</span>
                        </div>
                        ` : ''}
                        <div class="flex justify-between items-center font-bold pt-1">
                            <span class="text-xs text-sub">Jami to'lov:</span>
                            <span class="text-base text-amber-600 font-black">${finalTotal.toLocaleString()} so'm</span>
                        </div>
                    </div>
                </div>

                <button onclick="placeOrder()" class="w-full bg-slate-900 active:bg-slate-800 text-white py-3.5 rounded-2xl font-bold shadow-xl transition-all active:scale-[0.98] flex justify-center items-center space-x-2">
                    <i class="fa-solid fa-circle-check text-amber-400"></i>
                    <span class="text-xs">Buyurtmani tasdiqlash</span>
                </button>`;

            const list = document.getElementById("cart-items");
            items.forEach(i => {
                const row = document.createElement("div");
                row.className = "p-3 card-bg rounded-2xl shadow-sm border flex justify-between items-center";
                row.innerHTML = `
                    <div class="text-xs font-bold text-title">${i.product.name}</div>
                    <div class="flex items-center space-x-2">
                        <button class="w-7 h-7 bg-slate-500/10 active:bg-slate-500/20 rounded-lg font-bold text-title transition-all flex items-center justify-center text-xs" onclick="changeQty(${i.product.id}, -1)">−</button>
                        <span class="text-xs font-bold w-5 text-center text-title">${i.qty}</span>
                        <button class="w-7 h-7 bg-slate-500/10 active:bg-slate-500/20 rounded-lg font-bold text-title transition-all flex items-center justify-center text-xs" onclick="changeQty(${i.product.id}, 1)">+</button>
                    </div>`;
                list.appendChild(row);
            });
        }

        function setOrderType(type) { orderType = type; openCart(); }
        function setPayment(method) { paymentMethod = method; openCart(); }

        function applyPromoCode() {
            const code = document.getElementById("promo-input").value.trim().toUpperCase();
            if (code === "PROMO10") {
                promoCode = code;
                promoDiscountPercent = 10;
                alert("PROMO10 kod qabul qilindi! 10% chegirma berildi.");
            } else if (code === "") {
                promoCode = "";
                promoDiscountPercent = 0;
            } else {
                alert("Noto'g'ri promo-kod!");
                promoDiscountPercent = 0;
            }
            openCart();
        }

        function getLocation() {
            const status = document.getElementById("location-status");
            if (tg && tg.LocationManager) {
                tg.LocationManager.getLocation((data) => {
                    if (data) {
                        userLocation = { lat: data.latitude, lon: data.longitude };
                        if (status) status.textContent = "📍 Geolokatsiya aniqlandi!";
                    }
                });
            } else if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                    if (status) status.textContent = "📍 Geolokatsiya aniqlandi!";
                });
            } else {
                alert("Geolokatsiya qo'llab-quvvatlanmaydi.");
            }
        }

        function toggleCashbackUse(checked) {
            useCashback = checked;
            openCart();
        }

        function changeQty(productId, delta) {
            if (!cart[productId]) return;
            cart[productId].qty += delta;
            if (cart[productId].qty <= 0) delete cart[productId];
            
            if (Object.keys(cart).length === 0) {
                loadProducts(currentPartnerId, currentPartnerName);
            } else {
                openCart();
            }
        }

        async function placeOrder() {
            let address = "";
            if (orderType === 'delivery') {
                address = document.getElementById("delivery-address")?.value.trim() || "";
                if (!address && !userLocation) { 
                    alert("Iltimos, yetkazish manzilini kiriting yoki geolokatsiyani yuboring"); 
                    return; 
                }
            }

            const comment = document.getElementById("order-comment")?.value.trim() || "";
            const items = Object.values(cart).map(i => ({ product_id: i.product.id, quantity: i.qty }));

            try {
                const result = await api("/order", { 
                    partner_id: currentPartnerId, 
                    delivery_address: address, 
                    order_type: orderType,
                    payment_method: paymentMethod,
                    promo_code: promoCode,
                    comment: comment,
                    location: userLocation,
                    items,
                    use_cashback: useCashback 
                });

                document.getElementById("app").innerHTML = `
                    <div class="text-center py-16 card-bg rounded-3xl p-6 shadow-sm border my-4">
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-xl font-black text-title mb-1">Buyurtma qabul qilindi!</h2>
                        <p class="text-xs text-sub font-medium mb-3">Buyurtma ID: #${result.order_id || result.id}</p>
                        <p class="text-xs text-sub">Tez orada operator yoki kuryerimiz siz bilan bog'lanadi.</p>
                    </div>`;
                document.getElementById("cart-bar").classList.add("hidden");
                cart = {};
                useCashback = false;
                promoCode = '';
                promoDiscountPercent = 0;
                if (tg) setTimeout(() => tg.close(), 3000);
            } catch (e) {
                alert("Xatolik: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>
